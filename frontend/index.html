<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ConectaTec · Tablero Kanban de Triaje Inteligente ISP</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #F4F6F8;
            --panel: #FFFFFF;
            --header: #0E1A30;
            --line: #E1E6EB;
            --text: #1C252E;
            --muted: #637381;
            --brand: #1E6F64;
            --brand-light: #E3F2EE;
            --alta: #D32F2F;
            --alta-bg: #FDEDED;
            --media: #ED6C02;
            --media-bg: #FFF4E5;
            --baja: #2E7D32;
            --baja-bg: #EDF7ED;
            --card-shadow: 0 2px 8px rgba(0,0,0,0.06);
            --font-sans: 'IBM Plex Sans', -apple-system, sans-serif;
            --font-mono: 'JetBrains Mono', monospace;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: var(--font-sans); background: var(--bg); color: var(--text); line-height: 1.5; }

        header {
            background: var(--header);
            color: #FFFFFF;
            padding: 16px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 3px solid var(--brand);
        }

        .header-title h1 { font-size: 20px; font-weight: 700; letter-spacing: -0.01em; }
        .header-title p { font-size: 13px; color: #919EAB; }

        .ia-status-badge {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.15);
            padding: 8px 14px;
            border-radius: 999px;
            font-size: 13px;
        }

        .dot-green { width: 10px; height: 10px; border-radius: 50%; background: #4CAF50; box-shadow: 0 0 8px #4CAF50; }
        .dot-orange { width: 10px; height: 10px; border-radius: 50%; background: #FF9800; box-shadow: 0 0 8px #FF9800; }

        .container {
            display: grid;
            grid-template-columns: 360px 1fr;
            gap: 24px;
            padding: 24px;
            max-width: 1700px;
            margin: 0 auto;
        }

        /* Formulario lateral */
        .sidebar {
            background: var(--panel);
            border-radius: 16px;
            padding: 20px;
            box-shadow: var(--card-shadow);
            border: 1px solid var(--line);
            height: fit-content;
        }

        .sidebar h2 { font-size: 17px; margin-bottom: 12px; color: var(--header); }

        .form-group { margin-bottom: 14px; }
        .form-group label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; color: var(--text); }
        .form-control {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid var(--line);
            border-radius: 8px;
            font-family: inherit;
            font-size: 14px;
            background: #FAFAFA;
        }
        .form-control:focus { outline: none; border-color: var(--brand); background: #FFF; }
        textarea.form-control { resize: vertical; min-height: 110px; }

        .btn-submit {
            width: 100%;
            background: var(--brand);
            color: #FFF;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn-submit:hover { background: #15544B; }
        .btn-submit:disabled { opacity: 0.5; cursor: not-allowed; }

        .quick-presets { margin-top: 14px; border-top: 1px solid var(--line); padding-top: 12px; }
        .quick-presets p { font-size: 12px; font-weight: 600; color: var(--muted); margin-bottom: 6px; }
        .preset-btn {
            background: #F4F6F8;
            border: 1px solid var(--line);
            padding: 5px 10px;
            border-radius: 6px;
            font-size: 12px;
            margin-right: 6px;
            margin-bottom: 6px;
            cursor: pointer;
        }
        .preset-btn:hover { border-color: var(--brand); }

        /* Tablero Kanban */
        .kanban-board {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 16px;
            align-items: start;
        }

        .kanban-col {
            background: #EBEEF2;
            border-radius: 12px;
            padding: 14px;
            min-height: 600px;
        }

        .kanban-col-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            font-size: 14px;
            font-weight: 700;
        }

        .col-badge {
            background: #FFF;
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 12px;
            color: var(--muted);
        }

        /* Tarjeta de Ticket */
        .ticket-card {
            background: var(--panel);
            border-radius: 10px;
            padding: 14px;
            margin-bottom: 12px;
            box-shadow: var(--card-shadow);
            border-left: 4px solid #9E9E9E;
            transition: transform 0.15s;
        }
        .ticket-card:hover { transform: translateY(-2px); }

        .ticket-card.p-alta { border-left-color: var(--alta); }
        .ticket-card.p-media { border-left-color: var(--media); }
        .ticket-card.p-baja { border-left-color: var(--baja); }

        .ticket-header {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            margin-bottom: 6px;
        }

        .ticket-code { font-family: var(--font-mono); font-size: 12px; font-weight: 600; color: var(--muted); }
        .ticket-prio {
            font-size: 11px;
            font-weight: 700;
            padding: 2px 6px;
            border-radius: 4px;
            text-transform: uppercase;
        }
        .p-alta .ticket-prio { background: var(--alta-bg); color: var(--alta); }
        .p-media .ticket-prio { background: var(--media-bg); color: var(--media); }
        .p-baja .ticket-prio { background: var(--baja-bg); color: var(--baja); }

        .ticket-client { font-weight: 600; font-size: 13.5px; margin-bottom: 4px; }
        .ticket-desc { font-size: 13px; color: #454F5B; margin-bottom: 10px; line-height: 1.4; }

        .ticket-meta {
            background: #F9FAFB;
            border: 1px solid var(--line);
            border-radius: 6px;
            padding: 8px;
            font-size: 12px;
            margin-bottom: 10px;
        }
        .meta-row { display: flex; justify-content: space-between; margin-bottom: 2px; }
        .meta-row:last-child { margin-bottom: 0; }
        .meta-lbl { color: var(--muted); }

        .ticket-cita {
            background: var(--brand-light);
            border-radius: 6px;
            padding: 6px 8px;
            font-size: 11.5px;
            color: var(--brand);
            margin-bottom: 10px;
        }

        .ticket-actions {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }
        .act-btn {
            background: #FFF;
            border: 1px solid var(--line);
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 11.5px;
            font-weight: 600;
            cursor: pointer;
        }
        .act-btn:hover { background: #F4F6F8; border-color: #919EAB; }

        @media (max-width: 1200px) {
            .container { grid-template-columns: 1fr; }
            .kanban-board { grid-template-columns: 1fr 1fr; }
        }
        @media (max-width: 700px) {
            .kanban-board { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <header>
        <div class="header-title">
            <h1>ConectaTec · Triaje Inteligente ISP</h1>
            <p>Caso N.º 03 · Grupo 3 UNIANDES | Mesa de Ayuda y Diagnóstico con IA & RAG</p>
        </div>
        <div id="iaStatusBadge" class="ia-status-badge">
            <span class="dot-green"></span>
            <span id="iaStatusText">🟢 Proveedor: Gemini 1.5 Flash (Nominal)</span>
        </div>
    </header>

    <div class="container">
        <!-- Panel lateral de nuevo reporte -->
        <aside class="sidebar">
            <h2>Ingresar Solicitud de Soporte</h2>
            <form id="ticketForm">
                <div class="form-group">
                    <label for="nombreCliente">Nombre del Abonado</label>
                    <input type="text" id="nombreCliente" class="form-control" placeholder="Ej. Roberto Andrade" required>
                </div>
                <div class="form-group">
                    <label for="emailCliente">Correo Electrónico</label>
                    <input type="email" id="emailCliente" class="form-control" placeholder="cliente@example.com" required>
                </div>
                <div class="form-group">
                    <label for="codigoAbonado">Código de Cliente (Opcional)</label>
                    <input type="text" id="codigoAbonado" class="form-control" placeholder="CLI-4029">
                </div>
                <div class="form-group">
                    <label for="descripcionProblema">Descripción del Problema / Síntomas</label>
                    <textarea id="descripcionProblema" class="form-control" placeholder="Describa la avería, luces del router o error..." required></textarea>
                </div>
                <button type="submit" id="btnSubmit" class="btn-submit">⚡ Clasificar con IA y Crear Ticket</button>
            </form>

            <div class="quick-presets">
                <p>Probar Casos Reales del Corpus:</p>
                <button type="button" class="preset-btn" onclick="cargarPreset('los')">🔴 Luz LOS Roja Huawei</button>
                <button type="button" class="preset-btn" onclick="cargarPreset('lento')">🐢 Lentitud / Fast Ethernet</button>
                <button type="button" class="preset-btn" onclick="cargarPreset('wifi')">🔑 Cambio Clave Wi-Fi</button>
                <button type="button" class="preset-btn" onclick="cargarPreset('mora')">💳 Corte por Factura</button>
            </div>
        </aside>

        <!-- Tablero Kanban de 4 columnas -->
        <main class="kanban-board">
            <div class="kanban-col" id="col-nuevo">
                <div class="kanban-col-header">
                    <span>🆕 Nuevos</span>
                    <span class="col-badge" id="count-nuevo">0</span>
                </div>
                <div class="cards-container" id="cards-nuevo"></div>
            </div>

            <div class="kanban-col" id="col-en_atencion">
                <div class="kanban-col-header">
                    <span>⚙️ En Atención</span>
                    <span class="col-badge" id="count-en_atencion">0</span>
                </div>
                <div class="cards-container" id="cards-en_atencion"></div>
            </div>

            <div class="kanban-col" id="col-escalado_cuadrilla">
                <div class="kanban-col-header">
                    <span>🚚 Escalado a Cuadrilla</span>
                    <span class="col-badge" id="count-escalado_cuadrilla">0</span>
                </div>
                <div class="cards-container" id="cards-escalado_cuadrilla"></div>
            </div>

            <div class="kanban-col" id="col-resuelto">
                <div class="kanban-col-header">
                    <span>✅ Resueltos</span>
                    <span class="col-badge" id="count-resuelto">0</span>
                </div>
                <div class="cards-container" id="cards-resuelto"></div>
            </div>
        </main>
    </div>

    <script>
        const API_URL = '/v1/tickets';

        const PRESETS = {
            los: {
                nombre: "Gonzalo Benitez",
                email: "g.benitez@empresa.com",
                codigo: "CLI-9981",
                desc: "Se cayó el internet de toda la oficina y el router Huawei tiene una luz roja parpadeando que dice LOS. No tenemos conexión hace 20 minutos."
            },
            lento: {
                nombre: "Lucia Morales",
                email: "lucia.morales@gmail.com",
                codigo: "CLI-3104",
                desc: "Tengo contratado plan de 300 megas pero en la prueba speedtest con cable directo a mi laptop no pasa de 94 Mbps."
            },
            wifi: {
                nombre: "Esteban Salazar",
                email: "esteban.s@yahoo.com",
                codigo: "CLI-1150",
                desc: "Buenas tardes, deseo cambiar el nombre de mi red Wi-Fi y poner una nueva contraseña más segura de 12 letras."
            },
            mora: {
                nombre: "Familia Torres",
                email: "torres.fam@outlook.com",
                codigo: "CLI-5542",
                desc: "Las luces del router están verdes pero al intentar abrir páginas web me redirige a un aviso de cobranzas y corte de servicio."
            }
        };

        function cargarPreset(tipo) {
            const p = PRESETS[tipo];
            document.getElementById('nombreCliente').value = p.nombre;
            document.getElementById('emailCliente').value = p.email;
            document.getElementById('codigoAbonado').value = p.codigo;
            document.getElementById('descripcionProblema').value = p.desc;
        }

        async function cargarTickets() {
            try {
                const res = await fetch(API_URL);
                if (!res.ok) return;
                const data = await res.json();
                renderizarTablero(data.tickets);
            } catch (err) {
                console.error("Error al cargar tickets:", err);
            }
        }

        function renderizarTablero(tickets) {
            const cols = {
                nuevo: document.getElementById('cards-nuevo'),
                en_atencion: document.getElementById('cards-en_atencion'),
                escalado_cuadrilla: document.getElementById('cards-escalado_cuadrilla'),
                resuelto: document.getElementById('cards-resuelto')
            };

            const counts = { nuevo: 0, en_atencion: 0, escalado_cuadrilla: 0, resuelto: 0 };
            Object.values(cols).forEach(c => c.innerHTML = '');

            tickets.forEach(t => {
                const estado = t.estado in cols ? t.estado : 'nuevo';
                counts[estado]++;

                const card = document.createElement('div');
                const prioClass = t.prioridad === 'Alta' ? 'p-alta' : (t.prioridad === 'Media' ? 'p-media' : 'p-baja');
                card.className = `ticket-card ${prioClass}`;

                const citaTxt = t.citas && t.citas.length > 0 ? 
                    `📖 <b>${t.citas[0].documento_id}:</b> ${t.citas[0].paso_exacto}` : 'Autoatención Nivel 1';

                card.innerHTML = `
                    <div class="ticket-header">
                        <span class="ticket-code">${t.ticket_codigo}</span>
                        <span class="ticket-prio">${t.prioridad} · SLA ${t.sla_minutos}m</span>
                    </div>
                    <div class="ticket-client">${t.nombre_cliente}</div>
                    <div class="ticket-desc">${t.descripcion_problema}</div>
                    <div class="ticket-meta">
                        <div class="meta-row"><span class="meta-lbl">Categoría:</span> <b>${t.categoria}</b></div>
                        <div class="meta-row"><span class="meta-lbl">Impacto x Urg.:</span> ${t.impacto} x ${t.urgencia}</div>
                        <div class="meta-row"><span class="meta-lbl">IA:</span> ${t.metadatos_ia.proveedor} (${t.metadatos_ia.modelo.slice(0, 15)}...)</div>
                    </div>
                    <div class="ticket-cita">${citaTxt}</div>
                    <div class="ticket-actions">
                        ${estado !== 'en_atencion' ? `<button class="act-btn" onclick="cambiarEstado(${t.id}, 'en_atencion')">⚙️ Atender</button>` : ''}
                        ${estado !== 'escalado_cuadrilla' ? `<button class="act-btn" onclick="cambiarEstado(${t.id}, 'escalado_cuadrilla')">🚚 Escalar</button>` : ''}
                        ${estado !== 'resuelto' ? `<button class="act-btn" onclick="cambiarEstado(${t.id}, 'resuelto')">✅ Resolver</button>` : ''}
                    </div>
                `;
                cols[estado].appendChild(card);
            });

            document.getElementById('count-nuevo').textContent = counts.nuevo;
            document.getElementById('count-en_atencion').textContent = counts.en_atencion;
            document.getElementById('count-escalado_cuadrilla').textContent = counts.escalado_cuadrilla;
            document.getElementById('count-resuelto').textContent = counts.resuelto;
        }

        async function cambiarEstado(ticketId, nuevoEstado) {
            try {
                const res = await fetch(`${API_URL}/${ticketId}/estado`, {
                    method: 'PATCH',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ nuevo_estado: nuevoEstado })
                });
                if (res.ok) cargarTickets();
            } catch (err) {
                console.error("Error al cambiar estado:", err);
            }
        }

        document.getElementById('ticketForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('btnSubmit');
            btn.disabled = true;
            btn.textContent = '⏳ Analizando con IA y RAG...';

            const payload = {
                nombre_cliente: document.getElementById('nombreCliente').value,
                email_cliente: document.getElementById('emailCliente').value,
                codigo_abonado: document.getElementById('codigoAbonado').value || null,
                descripcion_problema: document.getElementById('descripcionProblema').value
            };

            try {
                const res = await fetch(`${API_URL}/clasificar`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                if (res.ok) {
                    const ticketCreado = await res.json();
                    
                    // Actualizar distintivo de IA según si hubo conmutación
                    const badge = document.getElementById('iaStatusBadge');
                    const badgeText = document.getElementById('iaStatusText');
                    
                    if (ticketCreado.metadatos_ia.conmutado) {
                        badge.innerHTML = `<span class="dot-orange"></span><span>🟠 Respaldo Activo: Groq Cloud (Llama 3.3)</span>`;
                    } else {
                        badge.innerHTML = `<span class="dot-green"></span><span>🟢 Proveedor: Gemini 1.5 Flash (Nominal)</span>`;
                    }

                    document.getElementById('ticketForm').reset();
                    cargarTickets();
                } else {
                    const err = await res.json();
                    alert(`Error: ${err.detail || 'Fallo en la clasificación'}`);
                }
            } catch (err) {
                alert("Error de conexión con el backend FastAPI.");
            } finally {
                btn.disabled = false;
                btn.textContent = '⚡ Clasificar con IA y Crear Ticket';
            }
        });

        // Cargar tickets al iniciar
        cargarTickets();
    </script>
</body>
</html>
